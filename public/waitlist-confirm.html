<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Confirm your email · Medlock</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/styles.css?v=2" />
    <script type="module" src="/assets/waitlist-confirm.js?v=1"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Medlock home"><span class="brand-mark" aria-hidden="true"></span>Medlock</a>
    </header>
    <main class="confirmation-page">
      <section class="waitlist confirmation-card" aria-labelledby="confirmation-title">
        <div class="section-copy">
          <p class="eyebrow">One last step</p>
          <h1 id="confirmation-title">Confirm that this address is yours.</h1>
          <p>The link itself changes nothing. Use the button below to finish joining the waitlist.</p>
        </div>
        <button type="button" data-confirm-button>Confirm Email</button>
        <p class="form-status" data-confirm-status aria-live="polite"></p>
        <p class="fine-print">Protected by reCAPTCHA Enterprise. Google’s Privacy Policy and Terms of Service apply.</p>
      </section>
    </main>
  </body>
</html>
