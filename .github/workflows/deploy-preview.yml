name: Deploy preview

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions: {}

jobs:
  invalidate:
    if: >-
      github.event.action == 'synchronize' ||
      github.event.action == 'converted_to_draft'
    permissions:
      id-token: write # Exchange only for the exact-SHA preview traffic operator.
      pull-requests: read # Let the reusable cleanup re-read current lifecycle state.
    uses: collinbentley1/platform/.github/workflows/cleanup-preview.yml@e34d6292dde50018ff8ff680a3526b415fa50302

  deploy:
    needs: invalidate
    if: >-
      always() &&
      (needs.invalidate.result == 'success' || needs.invalidate.result == 'skipped') &&
      github.event.action != 'converted_to_draft' &&
      github.event.pull_request.draft == false
    permissions:
      actions: read # Download the SBOM artifact produced by this workflow run.
      attestations: write # Publish provenance and SBOM attestations for the copied digest.
      contents: read
      id-token: write # Exchange only through the exact reusable-workflow environment paths.
      pull-requests: write # Post the exact-head preview URL after deployment.
    uses: collinbentley1/platform/.github/workflows/deploy-preview.yml@e34d6292dde50018ff8ff680a3526b415fa50302
