name: Deploy preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions: {}

jobs:
  invalidate:
    if: >-
      github.event.action == 'synchronize' ||
      github.event.action == 'converted_to_draft'
    permissions:
      id-token: write # Exchange only for the exact-SHA preview traffic operator.
    uses: collinbentley1/platform/.github/workflows/cleanup-preview.yml@d344f3835ca48f56c30a53641db8f3ea3a88ce53

  deploy:
    needs: invalidate
    if: >-
      always() &&
      (needs.invalidate.result == 'success' || needs.invalidate.result == 'skipped') &&
      github.event.action != 'converted_to_draft'
    permissions:
      actions: read # Download the SBOM artifact produced by this workflow run.
      attestations: write # Publish provenance and SBOM attestations for the copied digest.
      contents: read
      id-token: write # Exchange only through the exact reusable-workflow environment paths.
      packages: write # Publish and remove only the isolated GHCR staging image.
      pull-requests: write # Post the exact-head preview URL after deployment.
    uses: collinbentley1/platform/.github/workflows/deploy-preview.yml@d344f3835ca48f56c30a53641db8f3ea3a88ce53
    secrets:
      DHI_ACCESS_TOKEN: ${{ secrets.DHI_ACCESS_TOKEN }}
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      GRYPE_DB_MANIFEST_JSON: ${{ secrets.GRYPE_DB_MANIFEST_JSON }}
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
      SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN }}
