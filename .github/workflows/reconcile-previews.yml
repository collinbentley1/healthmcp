name: Reconcile previews

on:
  push:
    branches:
      - main
  schedule:
    # Reconcile hourly even though mutation jobs use the bounded FIFO queue;
    # this is the durable backstop for interrupted or externally drifted runs.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    permissions:
      actions: read # Download only the exact prefetch artifact id the reusable workflow produces.
      id-token: write # Exchange only for the exact-SHA preview traffic operator.
      pull-requests: read # Compare live tags with authoritative pull-request heads.
    uses: collinbentley1/platform/.github/workflows/reconcile-previews.yml@378116420ea2b48c5bb9dbb4cd42244a2f99c3db
