name: Automated review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    name: Automated review
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: write
    with:
      platform_sha: cdd84d99b01f47c93c2dbd4e7c39a5d6380d67e5
    uses: collinbentley1/platform/.github/workflows/review-gate-v1.yml@cdd84d99b01f47c93c2dbd4e7c39a5d6380d67e5
