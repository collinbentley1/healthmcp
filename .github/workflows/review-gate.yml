name: Automated review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    name: Automated review
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: write
    with:
      platform_sha: b5862f12d0e4cd96ed1452e1b83b6d4b9da72209
    uses: collinbentley1/platform/.github/workflows/review-gate-v1.yml@b5862f12d0e4cd96ed1452e1b83b6d4b9da72209
