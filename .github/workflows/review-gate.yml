name: Automated review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  run:
    name: Automated review
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      platform_sha: 625ba0bd3ba52e001715588e703916d0dfd7f32c
    uses: collinbentley1/platform/.github/workflows/review-gate-v1.yml@625ba0bd3ba52e001715588e703916d0dfd7f32c
