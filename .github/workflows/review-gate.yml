name: Automated review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    name: Automated review
    permissions:
      contents: read
      pull-requests: read
      checks: write
      actions: write
    with:
      platform_sha: cafbb495efcf9ceeaf583dbe47f8977ef849d7d3
    uses: collinbentley1/platform/.github/workflows/review-gate-v1.yml@cafbb495efcf9ceeaf583dbe47f8977ef849d7d3
