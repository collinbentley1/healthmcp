name: Automated review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  run:
    name: Automated review
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      platform_sha: dc8d6c1a6f8c619ca9c19904d6448544324d8c6d
    uses: collinbentley1/platform/.github/workflows/review-gate-v1.yml@dc8d6c1a6f8c619ca9c19904d6448544324d8c6d
