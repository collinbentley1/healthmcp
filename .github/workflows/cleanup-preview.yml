name: Cleanup preview

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions: {}

jobs:
  cleanup:
    permissions:
      id-token: write # Exchange only for the exact-SHA preview traffic operator.
      pull-requests: read # Let the reusable cleanup re-read current lifecycle state.
    uses: collinbentley1/platform/.github/workflows/cleanup-preview.yml@46756d9d98cafbf4a4c83396506bab63d6546f75
