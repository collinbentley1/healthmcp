name: Cleanup preview

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    uses: collinbentley1/platform/.github/workflows/cleanup-preview.yml@v0.2.0
    with:
      project-id: medlock-1025243085
      region: us-east4
      service-name: medlock
      workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      deploy-service-account: ${{ vars.GCP_PREVIEW_DEPLOY_SERVICE_ACCOUNT }}
