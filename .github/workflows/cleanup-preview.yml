name: Cleanup preview

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions: {}

jobs:
  cleanup:
    permissions:
      id-token: write # Exchange only for the exact-SHA preview traffic operator.
      pull-requests: read # Let the reusable cleanup re-read current lifecycle state.
    uses: collinbentley1/platform/.github/workflows/cleanup-preview.yml@3ce4e9ea52d5e420b5487591f4514cc28d5ab21a
