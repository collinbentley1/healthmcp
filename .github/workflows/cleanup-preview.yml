name: Cleanup preview

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions: {}

jobs:
  cleanup:
    permissions:
      id-token: write # Exchange only for the exact-SHA preview traffic operator.
      pull-requests: read # Let the reusable cleanup re-read current lifecycle state.
    uses: collinbentley1/platform/.github/workflows/cleanup-preview.yml@625efd11af9fd3b7f4d0ca972475173d5b25a472
