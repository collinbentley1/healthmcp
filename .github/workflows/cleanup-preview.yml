name: Cleanup preview

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions: {}

jobs:
  cleanup:
    permissions:
      id-token: write # Exchange only for the exact-SHA preview traffic operator.
      pull-requests: read # Let the reusable cleanup re-read current lifecycle state.
    uses: collinbentley1/platform/.github/workflows/cleanup-preview.yml@6b1c93fabe0669b037f0d0cd8e8be14f8a4d5fb4
