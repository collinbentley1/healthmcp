name: Cleanup preview

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions: {}

jobs:
  cleanup:
    permissions:
      actions: read # Download only the exact prefetch artifact id the reusable workflow produces.
      id-token: write # Exchange only for the exact-SHA preview traffic operator.
      pull-requests: read # Let the reusable cleanup re-read current lifecycle state.
    uses: collinbentley1/platform/.github/workflows/cleanup-preview.yml@378116420ea2b48c5bb9dbb4cd42244a2f99c3db
