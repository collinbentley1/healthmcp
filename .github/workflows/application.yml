name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: 97e093b361f39b8fa7da63d34b8cfa0e0ad62edf
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@97e093b361f39b8fa7da63d34b8cfa0e0ad62edf
