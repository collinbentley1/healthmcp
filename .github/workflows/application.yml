name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: 1c9466bcb58fc43c90cb5232031963eb09726429
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@1c9466bcb58fc43c90cb5232031963eb09726429
