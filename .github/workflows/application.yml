name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: 625ba0bd3ba52e001715588e703916d0dfd7f32c
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@625ba0bd3ba52e001715588e703916d0dfd7f32c
