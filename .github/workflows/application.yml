name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: cdd84d99b01f47c93c2dbd4e7c39a5d6380d67e5
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@cdd84d99b01f47c93c2dbd4e7c39a5d6380d67e5
