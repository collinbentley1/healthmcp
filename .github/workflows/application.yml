name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: dc8d6c1a6f8c619ca9c19904d6448544324d8c6d
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@dc8d6c1a6f8c619ca9c19904d6448544324d8c6d
