name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: 8fa2b3880fbcb76b87125b364de1a140a739fe67
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@8fa2b3880fbcb76b87125b364de1a140a739fe67
