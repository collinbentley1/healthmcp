name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: b5862f12d0e4cd96ed1452e1b83b6d4b9da72209
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@b5862f12d0e4cd96ed1452e1b83b6d4b9da72209
