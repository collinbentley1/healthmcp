name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: 161b80ed362ce3c3c5bf177a1c2375b14b3e7266
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@161b80ed362ce3c3c5bf177a1c2375b14b3e7266
