name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: cafbb495efcf9ceeaf583dbe47f8977ef849d7d3
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@cafbb495efcf9ceeaf583dbe47f8977ef849d7d3
