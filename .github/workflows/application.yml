name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: e9385b2789b41d5dad1b78a3ba038885867101ee
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@e9385b2789b41d5dad1b78a3ba038885867101ee
