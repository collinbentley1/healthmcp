name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: 84aeb339b88049905fce795057d9b7c30111eeec
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@84aeb339b88049905fce795057d9b7c30111eeec
