name: Deploy production

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  infrastructure:
    permissions:
      contents: read
      id-token: write # Prove exact-SHA WIF and read cloud metadata for convergence only.
    uses: collinbentley1/platform/.github/workflows/infrastructure.yml@6b1c93fabe0669b037f0d0cd8e8be14f8a4d5fb4

  deploy:
    needs: infrastructure
    permissions:
      actions: read # Download the SBOM artifact produced by this workflow run.
      attestations: write # Publish provenance and SBOM attestations for the copied digest.
      contents: read
      id-token: write # Exchange only through exact production publish and deploy paths.
    uses: collinbentley1/platform/.github/workflows/deploy-prod.yml@6b1c93fabe0669b037f0d0cd8e8be14f8a4d5fb4
