name: Deploy production

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  infrastructure:
    permissions:
      contents: read
      id-token: write # Prove exact-SHA WIF and read cloud metadata for convergence only.
    uses: collinbentley1/platform/.github/workflows/infrastructure.yml@95ad7531492cba2891ec6d02fa2d821955cd36bc

  deploy:
    needs: infrastructure
    permissions:
      actions: read # Download the SBOM artifact produced by this workflow run.
      attestations: write # Publish provenance and SBOM attestations for the copied digest.
      contents: read
      id-token: write # Exchange only through exact production publish and deploy paths.
      packages: write # Publish and remove only the isolated GHCR staging image.
    uses: collinbentley1/platform/.github/workflows/deploy-prod.yml@95ad7531492cba2891ec6d02fa2d821955cd36bc
