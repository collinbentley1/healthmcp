name: Deploy production

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  infrastructure:
    permissions:
      contents: read
      id-token: write # Prove exact-SHA WIF and read cloud metadata for convergence only.
    uses: collinbentley1/platform/.github/workflows/infrastructure.yml@d344f3835ca48f56c30a53641db8f3ea3a88ce53

  deploy:
    needs: infrastructure
    permissions:
      actions: read # Download the SBOM artifact produced by this workflow run.
      attestations: write # Publish provenance and SBOM attestations for the copied digest.
      contents: read
      id-token: write # Exchange only through exact production publish and deploy paths.
      packages: write # Publish and remove only the isolated GHCR staging image.
    uses: collinbentley1/platform/.github/workflows/deploy-prod.yml@d344f3835ca48f56c30a53641db8f3ea3a88ce53
    secrets:
      DHI_ACCESS_TOKEN: ${{ secrets.DHI_ACCESS_TOKEN }}
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      GRYPE_DB_MANIFEST_JSON: ${{ secrets.GRYPE_DB_MANIFEST_JSON }}
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
      SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN }}
