name: Deploy production

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  infrastructure:
    permissions:
      contents: read
      id-token: write # Prove exact-SHA WIF and read cloud metadata for convergence only.
    uses: collinbentley1/platform/.github/workflows/infrastructure.yml@378116420ea2b48c5bb9dbb4cd42244a2f99c3db

  deploy:
    needs: infrastructure
    permissions:
      actions: read # Download the SBOM artifact produced by this workflow run.
      attestations: write # Publish provenance and SBOM attestations for the copied digest.
      contents: read
      id-token: write # Exchange only through exact production publish and deploy paths.
      pull-requests: read # The reusable deploy proves every live preview tag maps to an active PR head.
    uses: collinbentley1/platform/.github/workflows/deploy-prod.yml@378116420ea2b48c5bb9dbb4cd42244a2f99c3db
